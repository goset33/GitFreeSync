name: Release OSS (iOS)

on:
  push:
    tags:
      - v*

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust/.cargo/config.toml') }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-ios, x86_64-apple-ios

      - name: Create Secrets file
        run: |
          echo "Creating file with interpolated secrets"
          cat <<EOF > ./lib/constant/secrets.dart
          ${{ secrets.SECRETS }}
          EOF

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.2

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Install cargo-expand
        run: cargo install cargo-expand --version 1.0.121 --locked

      - name: Get Packages
        run: flutter pub get

      - name: Generate Rust
        run: |
          flutter_rust_bridge_codegen generate

      - name: Build iOS Application
        run: |
          flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          set -euo pipefail
          
          APP_PATH="build/ios/iphoneos/Runner.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Runner.app file not found!"
            exit 1
          fi
          
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          
          zip -r GitFreeSync.ipa Payload
          
          echo "IPA was created!"

      - name: Build Changelog
        id: changelog
        uses: ardalanamini/auto-changelog@v4
        with:
          preferred-api: Git
          mention-authors: false
          mention-new-contributors: false
          include-compare-link: false
          semver: false

      - name: Get Previous Tag
        id: previous_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_TAG=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "GitFreeSync.ipa"
          body: ${{ steps.changelog.outputs.changelog }}
          draft: true
          generateReleaseNotes: true
          generateReleaseNotesPreviousTag: ${{ steps.previous_tag.outputs.previous_tag }}
          name: Release ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
